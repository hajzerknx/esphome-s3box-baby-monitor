# SPDX-License-Identifier: Apache-2.0
#
# ESP32-S3-BOX-3 Baby Monitor — public v1.5.0
#
# Set camera_1_name and camera_2_name below. The same names are shown both on
# the monitor LCD and in the Home Assistant Camera select entity.
#
# Before compiling with Cry ML, run:
#   python3 tools/fetch_cry_model.py
#
# Use a low-resolution MJPEG substream. High-resolution primary streams are not
# an intended workload for this 320x240 ESP32-S3 display.

substitutions:
  name: baby-monitor-box3
  friendly_name: Baby Monitor BOX-3

  # These names are shown on the monitor and in the Home Assistant Camera select entity.
  camera_1_name: "Camera 1"
  camera_2_name: "Camera 2"

  camera_1_user: !secret baby_monitor_camera_1_user
  camera_2_user: !secret baby_monitor_camera_2_user
  camera_1_password: !secret baby_monitor_camera_1_password
  camera_2_password: !secret baby_monitor_camera_2_password

  camera_1_host: !secret baby_monitor_camera_1_host
  camera_2_host: !secret baby_monitor_camera_2_host
  camera_1_rtsp_path: "/cam/realmonitor?channel=1&subtype=1"
  camera_2_rtsp_path: "/cam/realmonitor?channel=1&subtype=1"

  battery_voltage_factor: "4.01"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.4
  on_boot:
    priority: -100
    then:
      - delay: 250ms
      - lambda: |-
          id(hardware_mute_active) = id(hardware_mute_status).state;
          const bool effective = id(audio_ha_requested_v113) && !id(hardware_mute_active);
          id(camera_audio_enabled).publish_state(effective);
          id(baby_monitor_media).set_audio_enabled(effective);
          id(speaker_amp_enable).turn_off();
          ESP_LOGI("baby_mute", "Boot sync: requested=%s hardware=%s effective=%s",
                   id(audio_ha_requested_v113) ? "ON" : "OFF",
                   id(hardware_mute_active) ? "MUTED" : "UNMUTED",
                   effective ? "ON" : "OFF");

esp32:
  board: esp32s3box
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_FREERTOS_TASK_CREATE_ALLOW_EXT_MEM: "y"


psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG
  on_message:
    level: ERROR
    then:
      - lambda: |-
          if (tag != nullptr && message != nullptr &&
              strcmp(tag, "spi-esp-idf") == 0 &&
              strstr(message, "Transmit failed - err 101") != nullptr) {
            id(baby_monitor_media).record_spi_err101();
          }

api:

ota:
  - platform: esphome

safe_mode:
  num_attempts: 3
  boot_is_good_after: 30s

network:
  enable_high_performance: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

  manual_ip:
    static_ip: !secret baby_monitor_static_ip
    gateway: !secret network_gateway
    subnet: !secret network_subnet

spi:
  - id: spi_bus
    clk_pin: GPIO7
    mosi_pin: GPIO6

display:
  - platform: mipi_spi
    id: box_display
    model: S3BOX
    invert_colors: false
    data_rate: 40MHz
    cs_pin: GPIO5
    dc_pin: GPIO4
    reset_pin:
      number: GPIO48
      inverted: true
    color_depth: 16
    byte_order: big_endian
    buffer_size: 0.12
    auto_clear_enabled: false
    update_interval: never


i2c:
  - id: audio_i2c
    sda: GPIO8
    scl: GPIO18
    frequency: 100kHz

touchscreen:
  - platform: gt911
    id: box_touch
    i2c_id: audio_i2c
    address: 0x5D
    display: box_display
    interrupt_pin:
      number: GPIO3
      ignore_strapping_warning: true

    on_touch:
      - if:
          condition:
            switch.is_off: monitor_power
          then:
            - switch.turn_on: monitor_power
          else:
            - if:
                condition:
                  switch.is_off: night_mode
                then:
                  - select.next:
                      id: camera_select
                      cycle: true
                else:
                  - lambda: 'return;'

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: audio_i2c
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000
    use_mclk: true
    use_microphone: false

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: GPIO45
      ignore_strapping_warning: true
    i2s_bclk_pin: GPIO17
    i2s_mclk_pin: GPIO2

speaker:
  - platform: i2s_audio
    id: monitor_speaker
    i2s_audio_id: i2s_output
    i2s_dout_pin: GPIO15
    dac_type: external
    audio_dac: es8311_dac
    channel: left
    sample_rate: 16000
    bits_per_sample: 16bit
    buffer_duration: 180ms
    timeout: never

external_components:
  - source:
      type: local
      path: components
    components: [baby_monitor]

baby_monitor:
  id: baby_monitor_media
  display: box_display
  speaker: monitor_speaker
  audio_volume: 5%

  camera_1:
    name: "${camera_1_name}"
    host: ${camera_1_host}
    port: 554
    username: ${camera_1_user}
    password: ${camera_1_password}
    path: "${camera_1_rtsp_path}"

  camera_2:
    name: "${camera_2_name}"
    host: ${camera_2_host}
    port: 554
    username: ${camera_2_user}
    password: ${camera_2_password}
    path: "${camera_2_rtsp_path}"

globals:
  - id: active_camera_index
    type: int
    restore_value: no
    initial_value: "0"

  - id: camera_1_baseline
    type: float
    restore_value: no
    initial_value: "-76.0"
  - id: camera_2_baseline
    type: float
    restore_value: no
    initial_value: "-65.0"

  - id: camera_1_ambient_candidate
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: camera_1_ambient_min
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: camera_1_ambient_max
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: camera_1_ambient_started_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_1_ambient_nudge_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: camera_1_baseline_resume_after_ms_v120d4
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: camera_2_ambient_candidate
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: camera_2_ambient_min
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: camera_2_ambient_max
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: camera_2_ambient_started_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_2_ambient_nudge_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: camera_2_baseline_resume_after_ms_v120d4
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: camera_audio_volume_pct_v122
    type: float
    restore_value: yes
    initial_value: "25.0"

  - id: audio_ha_requested_v113
    type: bool
    restore_value: no
    initial_value: "true"
  - id: hardware_mute_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: camera_1_t1_offset_v122
    type: float
    restore_value: yes
    initial_value: "15.0"
  - id: camera_1_t2_offset
    type: float
    restore_value: yes
    initial_value: "32.0"
  - id: camera_1_t1_floor_v122
    type: float
    restore_value: yes
    initial_value: "-60.0"
  - id: camera_1_t2_floor
    type: float
    restore_value: yes
    initial_value: "-40.0"

  - id: camera_2_t1_offset
    type: float
    restore_value: yes
    initial_value: "20.0"
  - id: camera_2_t2_offset
    type: float
    restore_value: yes
    initial_value: "30.0"
  - id: camera_2_t1_floor
    type: float
    restore_value: yes
    initial_value: "-45.0"
  - id: camera_2_t2_floor
    type: float
    restore_value: yes
    initial_value: "-32.0"

  - id: alarm_t1_confirm_ms_v122
    type: uint32_t
    restore_value: yes
    initial_value: "1000"
  - id: alarm_t2_confirm_ms
    type: uint32_t
    restore_value: yes
    initial_value: "1000"

  - id: alarm_t1_hold_ms_v120d2
    type: uint32_t
    restore_value: yes
    initial_value: "20000"
  - id: alarm_t2_hold_ms_v120d2
    type: uint32_t
    restore_value: yes
    initial_value: "60000"
  - id: alarm_audio_hysteresis_db_v120d2
    type: float
    restore_value: yes
    initial_value: "2.0"

  - id: camera_1_motion_until
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_1_sound1_until
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_1_sound2_until
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_1_cry_until
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_2_motion_until
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: local_motion_hold_ms_v130d1
    type: uint32_t
    restore_value: no
    initial_value: "20000"
  - id: camera_2_sound1_until
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_2_sound2_until
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_2_cry_until
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: camera_1_sound_gate
    type: bool
    restore_value: no
    initial_value: "false"
  - id: camera_2_sound_gate
    type: bool
    restore_value: no
    initial_value: "false"
  - id: camera_1_t1_started
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_1_t2_started
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_2_t1_started
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_2_t2_started
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: camera_1_t1_armed_v120d5
    type: bool
    restore_value: no
    initial_value: "false"
  - id: camera_1_t2_armed_v120d5
    type: bool
    restore_value: no
    initial_value: "false"
  - id: camera_2_t1_armed_v120d5
    type: bool
    restore_value: no
    initial_value: "false"
  - id: camera_2_t2_armed_v120d5
    type: bool
    restore_value: no
    initial_value: "false"

  - id: camera_1_sound_last_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_2_sound_last_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: night_wake_until
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: night_alarm_wake_seconds
    type: float
    restore_value: yes
    initial_value: "30.0"

  - id: active_alarm_level
    type: int
    restore_value: no
    initial_value: "0"
  - id: active_alarm_baseline
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: active_alarm_t1
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: active_alarm_t2
    type: float
    restore_value: no
    initial_value: "NAN"

output:
  - platform: gpio
    id: backlight_output
    pin: GPIO47

  - platform: gpio
    id: speaker_amp_enable
    pin: GPIO46


switch:
  - platform: template
    id: monitor_power
    name: "Monitor"
    icon: "mdi:monitor-speaker"
    optimistic: true
    restore_mode: ALWAYS_OFF

    turn_on_action:
      - output.turn_on: backlight_output
      - lambda: |-
          const bool effective_audio = id(audio_ha_requested_v113) && !id(hardware_mute_active);
          id(camera_audio_enabled).publish_state(effective_audio);
          id(baby_monitor_media).set_audio_enabled(effective_audio);
          if (effective_audio) id(speaker_amp_enable).turn_on();
          else id(speaker_amp_enable).turn_off();
      - delay: 20ms
      - lambda: |-
          id(camera_1_motion_until) = id(camera_1_sound1_until) = id(camera_1_sound2_until) = id(camera_1_cry_until) = 0;
          id(camera_2_motion_until) = id(camera_2_sound1_until) = id(camera_2_sound2_until) = id(camera_2_cry_until) = 0;
          id(camera_1_sound_gate) = false;
          id(camera_2_sound_gate) = false;
          id(camera_1_t1_armed_v120d5) = id(camera_1_t2_armed_v120d5) = false;
          id(camera_2_t1_armed_v120d5) = id(camera_2_t2_armed_v120d5) = false;
          id(active_alarm_level) = 0;
          id(baby_monitor_media).set_alarm_level(0); id(baby_monitor_media).set_alarm_cause_mask(0);
          id(baby_monitor_media).set_audio_enabled(id(audio_ha_requested_v113) && !id(hardware_mute_active));
          id(baby_monitor_media).set_audio_volume((id(camera_audio_volume_pct_v122) / 100.0f) * 0.20f);
          id(baby_monitor_media).set_enabled(true);

    turn_off_action:
      - lambda: |-
          if (id(night_mode).state) id(night_mode).publish_state(false);
          id(night_wake_until) = 0;
          id(active_alarm_level) = 0;
          id(baby_monitor_media).set_alarm_level(0); id(baby_monitor_media).set_alarm_cause_mask(0);
          id(camera_1_motion_until) = id(camera_1_sound1_until) = id(camera_1_sound2_until) = id(camera_1_cry_until) = 0;
          id(camera_2_motion_until) = id(camera_2_sound1_until) = id(camera_2_sound2_until) = id(camera_2_cry_until) = 0;
          id(camera_1_sound_gate) = false;
          id(camera_2_sound_gate) = false;
          id(camera_1_t1_armed_v120d5) = id(camera_1_t2_armed_v120d5) = false;
          id(camera_2_t1_armed_v120d5) = id(camera_2_t2_armed_v120d5) = false;
          id(baby_monitor_media).set_enabled(false);
      - output.turn_off: speaker_amp_enable
      - output.turn_off: backlight_output

  - platform: template
    id: night_mode
    name: "Night Mode"
    icon: "mdi:weather-night"
    optimistic: true
    restore_mode: ALWAYS_OFF

    turn_on_action:
      - if:
          condition:
            switch.is_off: monitor_power
          then:
            - switch.turn_on: monitor_power
            - delay: 50ms
      - lambda: id(night_wake_until) = 0;
      - output.turn_off: backlight_output

    turn_off_action:
      - lambda: id(night_wake_until) = 0;
      - if:
          condition:
            switch.is_on: monitor_power
          then:
            - output.turn_on: backlight_output

  - platform: template
    id: camera_audio_enabled
    name: "Camera Audio"
    icon: "mdi:volume-high"
    optimistic: true
    restore_mode: DISABLED
    turn_on_action:
      - lambda: |-
          id(audio_ha_requested_v113) = true;
          const bool effective = !id(hardware_mute_active);
          id(camera_audio_enabled).publish_state(effective);
          id(baby_monitor_media).set_audio_enabled(effective);
          if (effective && id(monitor_power).state) id(speaker_amp_enable).turn_on();
          else id(speaker_amp_enable).turn_off();
    turn_off_action:
      - lambda: |-
          id(audio_ha_requested_v113) = false;
          id(camera_audio_enabled).publish_state(false);
          id(baby_monitor_media).set_audio_enabled(false);
          id(speaker_amp_enable).turn_off();

select:
  - platform: template
    id: camera_select
    name: "Camera"
    icon: "mdi:cctv"
    optimistic: true
    restore_value: false
    initial_option: "${camera_1_name}"
    options:
      - "${camera_1_name}"
      - "${camera_2_name}"

    set_action:
      - lambda: |-
          id(active_alarm_level) = 0;
          id(baby_monitor_media).set_alarm_level(0); id(baby_monitor_media).set_alarm_cause_mask(0);
          id(camera_1_motion_until) = id(camera_1_sound1_until) = id(camera_1_sound2_until) = id(camera_1_cry_until) = 0;
          id(camera_2_motion_until) = id(camera_2_sound1_until) = id(camera_2_sound2_until) = id(camera_2_cry_until) = 0;
          id(camera_1_sound_gate) = false;
          id(camera_2_sound_gate) = false;
          id(camera_1_t1_armed_v120d5) = id(camera_1_t2_armed_v120d5) = false;
          id(camera_2_t1_armed_v120d5) = id(camera_2_t2_armed_v120d5) = false;
          if (x == "${camera_2_name}") {
            id(active_camera_index) = 1;
            id(baby_monitor_media).set_camera(1);
          } else {
            id(active_camera_index) = 0;
            id(baby_monitor_media).set_camera(0);
          }


number:
  - platform: template
    id: night_alarm_wake_time
    name: "Alarm Wake Time"
    icon: "mdi:timer-outline"
    entity_category: config
    unit_of_measurement: "s"
    min_value: 10
    max_value: 120
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 30
    set_action:
      - lambda: id(night_alarm_wake_seconds) = x;

  - platform: template
    id: camera_audio_volume_v122
    name: "Camera Volume"
    icon: "mdi:volume-medium"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 25
    set_action:
      - lambda: |-
          id(camera_audio_volume_pct_v122) = x;
          id(baby_monitor_media).set_audio_volume((x / 100.0f) * 0.20f);

  - platform: template
    id: camera_1_t1_offset_v122_number
    name: "${camera_1_name} T1 Offset"
    icon: "mdi:tune-vertical"
    entity_category: config
    unit_of_measurement: "dB"
    min_value: 5
    max_value: 35
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 15
    set_action:
      - lambda: id(camera_1_t1_offset_v122) = x;

  - platform: template
    id: camera_1_t1_floor_v122_number
    name: "${camera_1_name} T1 Floor"
    icon: "mdi:volume-medium"
    entity_category: config
    unit_of_measurement: "dB"
    min_value: -75
    max_value: -30
    step: 1
    optimistic: true
    restore_value: true
    initial_value: -60
    set_action:
      - lambda: id(camera_1_t1_floor_v122) = x;

  - platform: template
    id: camera_1_t2_offset_number
    name: "${camera_1_name} T2 Offset"
    icon: "mdi:tune-vertical"
    entity_category: config
    unit_of_measurement: "dB"
    min_value: 10
    max_value: 45
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 32
    set_action:
      - lambda: id(camera_1_t2_offset) = x;

  - platform: template
    id: camera_1_t2_floor_number
    name: "${camera_1_name} T2 Floor"
    icon: "mdi:volume-high"
    entity_category: config
    unit_of_measurement: "dB"
    min_value: -65
    max_value: -20
    step: 1
    optimistic: true
    restore_value: true
    initial_value: -40
    set_action:
      - lambda: id(camera_1_t2_floor) = x;

  - platform: template
    id: camera_2_t1_offset_number
    name: "${camera_2_name} T1 Offset"
    icon: "mdi:tune-vertical"
    entity_category: config
    unit_of_measurement: "dB"
    min_value: 5
    max_value: 35
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 20
    set_action:
      - lambda: id(camera_2_t1_offset) = x;

  - platform: template
    id: camera_2_t1_floor_number
    name: "${camera_2_name} T1 Floor"
    icon: "mdi:volume-medium"
    entity_category: config
    unit_of_measurement: "dB"
    min_value: -75
    max_value: -25
    step: 1
    optimistic: true
    restore_value: true
    initial_value: -45
    set_action:
      - lambda: id(camera_2_t1_floor) = x;

  - platform: template
    id: camera_2_t2_offset_number
    name: "${camera_2_name} T2 Offset"
    icon: "mdi:tune-vertical"
    entity_category: config
    unit_of_measurement: "dB"
    min_value: 10
    max_value: 45
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 30
    set_action:
      - lambda: id(camera_2_t2_offset) = x;

  - platform: template
    id: camera_2_t2_floor_number
    name: "${camera_2_name} T2 Floor"
    icon: "mdi:volume-high"
    entity_category: config
    unit_of_measurement: "dB"
    min_value: -60
    max_value: -15
    step: 1
    optimistic: true
    restore_value: true
    initial_value: -32
    set_action:
      - lambda: id(camera_2_t2_floor) = x;

  - platform: template
    id: alarm_t1_confirm_number_v122
    name: "Alarm T1 Confirmation"
    icon: "mdi:timer-outline"
    entity_category: config
    unit_of_measurement: "s"
    min_value: 0.25
    max_value: 5.0
    step: 0.25
    optimistic: true
    restore_value: true
    initial_value: 1.0
    set_action:
      - lambda: id(alarm_t1_confirm_ms_v122) = (uint32_t) lroundf(x * 1000.0f);

  - platform: template
    id: alarm_t2_confirm_number
    name: "Alarm T2 Confirmation"
    icon: "mdi:timer-alert-outline"
    entity_category: config
    unit_of_measurement: "s"
    min_value: 0.25
    max_value: 3.0
    step: 0.25
    optimistic: true
