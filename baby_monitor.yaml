# SPDX-License-Identifier: Apache-2.0
#
# ESP32-S3-BOX-3 Baby Monitor — v1.0.0
#
# Copy secrets.example.yaml to secrets.yaml and configure your own values.
# Cry detection is disabled by default. To enable an external crying classifier,
# uncomment the package block below and configure the optional package.
#
# packages:
#   cry_detection: !include examples/cry-detection-home-assistant.yaml

substitutions:
  name: baby-monitor-box3
  friendly_name: Baby Monitor BOX-3

  camera_1_motion_entity: binary_sensor.camera_1_motion
  camera_1_sound_entity: sensor.camera_1_sound_level
  camera_2_motion_entity: binary_sensor.camera_2_motion
  camera_2_sound_entity: sensor.camera_2_sound_level

  camera_user: !secret baby_monitor_box3__camera_user
  camera_password: !secret baby_monitor_box3__camera_password

  camera_1_host: !secret baby_monitor_camera_1_host
  camera_2_host: !secret baby_monitor_camera_2_host
  camera_rtsp_path: "/cam/realmonitor?channel=1&subtype=1"

  battery_voltage_factor: "4.01"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  min_version: 2026.7.4
  on_boot:
    priority: -100
    then:
      - delay: 250ms
      - lambda: |-
          id(hardware_mute_active) = id(hardware_mute_status).state;
          const bool effective = id(audio_ha_requested) && !id(hardware_mute_active);
          id(camera_audio_enabled).publish_state(effective);
          id(baby_monitor_media).set_audio_enabled(effective);
          id(speaker_amp_enable).turn_off();
          ESP_LOGI("baby_mute", "Boot sync: requested=%s hardware=%s effective=%s",
                   id(audio_ha_requested) ? "ON" : "OFF",
                   id(hardware_mute_active) ? "MUTED" : "UNMUTED",
                   effective ? "ON" : "OFF");

esp32:
  board: esp32s3box
  flash_size: 16MB
  cpu_frequency: 240MHz
  framework:
    type: esp-idf
    sdkconfig_options:
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"

psram:
  mode: octal
  speed: 80MHz
  ignore_not_found: false

logger:
  level: INFO
  hardware_uart: USB_SERIAL_JTAG

api:

ota:
  - platform: esphome

safe_mode:
  num_attempts: 3
  boot_is_good_after: 30s

network:
  enable_high_performance: true

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none

  manual_ip:
    static_ip: !secret baby_monitor_static_ip
    gateway: !secret network_gateway
    subnet: !secret network_subnet

spi:
  - id: spi_bus
    clk_pin: GPIO7
    mosi_pin: GPIO6

display:
  - platform: mipi_spi
    id: box_display
    model: S3BOX
    invert_colors: false
    data_rate: 40MHz
    cs_pin: GPIO5
    dc_pin: GPIO4
    reset_pin:
      number: GPIO48
      inverted: true
    color_depth: 16
    byte_order: big_endian
    buffer_size: 0.12
    auto_clear_enabled: false
    update_interval: never


i2c:
  - id: audio_i2c
    sda: GPIO8
    scl: GPIO18
    frequency: 100kHz

touchscreen:
  - platform: gt911
    id: box_touch
    i2c_id: audio_i2c
    address: 0x5D
    display: box_display
    interrupt_pin:
      number: GPIO3
      ignore_strapping_warning: true

    on_touch:
      - if:
          condition:
            switch.is_off: monitor_power
          then:
            - switch.turn_on: monitor_power
          else:
            - if:
                condition:
                  switch.is_off: night_mode
                then:
                  - select.next:
                      id: camera_select
                      cycle: true
                else:
                  - lambda: 'return;'

audio_dac:
  - platform: es8311
    id: es8311_dac
    i2c_id: audio_i2c
    address: 0x18
    bits_per_sample: 16bit
    sample_rate: 16000
    use_mclk: true
    use_microphone: false

i2s_audio:
  - id: i2s_output
    i2s_lrclk_pin:
      number: GPIO45
      ignore_strapping_warning: true
    i2s_bclk_pin: GPIO17
    i2s_mclk_pin: GPIO2

speaker:
  - platform: i2s_audio
    id: monitor_speaker
    i2s_audio_id: i2s_output
    i2s_dout_pin: GPIO15
    dac_type: external
    audio_dac: es8311_dac
    channel: left
    sample_rate: 16000
    bits_per_sample: 16bit
    buffer_duration: 180ms
    timeout: never

external_components:
  - source:
      type: local
      path: components
    components: [baby_monitor]

baby_monitor:
  id: baby_monitor_media
  display: box_display
  speaker: monitor_speaker
  audio_volume: 5%

  camera_1:
    name: "Camera 1"
    host: ${camera_1_host}
    port: 554
    username: ${camera_user}
    password: ${camera_password}
    path: "${camera_rtsp_path}"

  camera_2:
    name: "Camera 2"
    host: ${camera_2_host}
    port: 554
    username: ${camera_user}
    password: ${camera_password}
    path: "${camera_rtsp_path}"

globals:
  - id: active_camera_index
    type: int
    restore_value: no
    initial_value: "0"

  - id: camera_1_baseline
    type: float
    restore_value: no
    initial_value: "-76.0"
  - id: camera_2_baseline
    type: float
    restore_value: no
    initial_value: "-65.0"

  - id: camera_1_ambient_candidate
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: camera_1_ambient_min
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: camera_1_ambient_max
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: camera_1_ambient_started_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_1_ambient_nudge_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: camera_2_ambient_candidate
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: camera_2_ambient_min
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: camera_2_ambient_max
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: camera_2_ambient_started_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_2_ambient_nudge_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: camera_audio_volume_pct
    type: float
    restore_value: yes
    initial_value: "25.0"

  - id: audio_ha_requested
    type: bool
    restore_value: yes
    initial_value: "true"
  - id: hardware_mute_active
    type: bool
    restore_value: no
    initial_value: "false"

  - id: camera_1_t1_offset
    type: float
    restore_value: yes
    initial_value: "15.0"
  - id: camera_1_t2_offset
    type: float
    restore_value: yes
    initial_value: "32.0"
  - id: camera_1_t1_floor
    type: float
    restore_value: yes
    initial_value: "-60.0"
  - id: camera_1_t2_floor
    type: float
    restore_value: yes
    initial_value: "-40.0"

  - id: camera_2_t1_offset
    type: float
    restore_value: yes
    initial_value: "20.0"
  - id: camera_2_t2_offset
    type: float
    restore_value: yes
    initial_value: "30.0"
  - id: camera_2_t1_floor
    type: float
    restore_value: yes
    initial_value: "-45.0"
  - id: camera_2_t2_floor
    type: float
    restore_value: yes
    initial_value: "-32.0"

  - id: alarm_t1_confirm_ms
    type: uint32_t
    restore_value: yes
    initial_value: "1000"
  - id: alarm_t2_confirm_ms
    type: uint32_t
    restore_value: yes
    initial_value: "1000"

  - id: camera_1_motion_until
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_1_sound1_until
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_1_sound2_until
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_1_external_level2_until
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_2_motion_until
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_2_sound1_until
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_2_sound2_until
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_2_external_level2_until
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: camera_1_sound_gate
    type: bool
    restore_value: no
    initial_value: "false"
  - id: camera_2_sound_gate
    type: bool
    restore_value: no
    initial_value: "false"
  - id: camera_1_t1_started
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_1_t2_started
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_2_t1_started
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_2_t2_started
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: camera_1_ha_last_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: camera_2_ha_last_ms
    type: uint32_t
    restore_value: no
    initial_value: "0"

  - id: night_wake_until
    type: uint32_t
    restore_value: no
    initial_value: "0"
  - id: night_alarm_wake_seconds
    type: float
    restore_value: yes
    initial_value: "30.0"

  - id: active_alarm_level
    type: int
    restore_value: no
    initial_value: "0"
  - id: active_alarm_baseline
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: active_alarm_t1
    type: float
    restore_value: no
    initial_value: "NAN"
  - id: active_alarm_t2
    type: float
    restore_value: no
    initial_value: "NAN"

output:
  - platform: gpio
    id: backlight_output
    pin: GPIO47

  - platform: gpio
    id: speaker_amp_enable
    pin: GPIO46


switch:
  - platform: template
    id: monitor_power
    name: "Monitor"
    icon: "mdi:monitor-speaker"
    optimistic: true
    restore_mode: ALWAYS_OFF

    turn_on_action:
      - output.turn_on: backlight_output
      - lambda: |-
          const bool effective_audio = id(audio_ha_requested) && !id(hardware_mute_active);
          id(camera_audio_enabled).publish_state(effective_audio);
          id(baby_monitor_media).set_audio_enabled(effective_audio);
          if (effective_audio) id(speaker_amp_enable).turn_on();
          else id(speaker_amp_enable).turn_off();
      - delay: 20ms
      - lambda: |-
          id(camera_1_motion_until) = id(camera_1_sound1_until) = id(camera_1_sound2_until) = id(camera_1_external_level2_until) = 0;
          id(camera_2_motion_until) = id(camera_2_sound1_until) = id(camera_2_sound2_until) = id(camera_2_external_level2_until) = 0;
          id(camera_1_sound_gate) = false;
          id(camera_2_sound_gate) = false;
          id(active_alarm_level) = 0;
          id(baby_monitor_media).set_alarm_level(0);
          id(baby_monitor_media).set_audio_enabled(id(audio_ha_requested) && !id(hardware_mute_active));
          id(baby_monitor_media).set_audio_volume((id(camera_audio_volume_pct) / 100.0f) * 0.20f);
          id(baby_monitor_media).set_enabled(true);

    turn_off_action:
      - lambda: |-
          if (id(night_mode).state) id(night_mode).publish_state(false);
          id(night_wake_until) = 0;
          id(active_alarm_level) = 0;
          id(baby_monitor_media).set_alarm_level(0);
          id(camera_1_motion_until) = id(camera_1_sound1_until) = id(camera_1_sound2_until) = id(camera_1_external_level2_until) = 0;
          id(camera_2_motion_until) = id(camera_2_sound1_until) = id(camera_2_sound2_until) = id(camera_2_external_level2_until) = 0;
          id(camera_1_sound_gate) = false;
          id(camera_2_sound_gate) = false;
          id(baby_monitor_media).set_enabled(false);
      - output.turn_off: speaker_amp_enable
      - output.turn_off: backlight_output

  - platform: template
    id: night_mode
    name: "Night Mode"
    icon: "mdi:weather-night"
    optimistic: true
    restore_mode: ALWAYS_OFF

    turn_on_action:
      - if:
          condition:
            switch.is_off: monitor_power
          then:
            - switch.turn_on: monitor_power
            - delay: 50ms
      - lambda: id(night_wake_until) = 0;
      - output.turn_off: backlight_output

    turn_off_action:
      - lambda: id(night_wake_until) = 0;
      - if:
          condition:
            switch.is_on: monitor_power
          then:
            - output.turn_on: backlight_output

  - platform: template
    id: camera_audio_enabled
    name: "Camera Audio"
    icon: "mdi:volume-high"
    optimistic: true
    restore_mode: DISABLED
    turn_on_action:
      - lambda: |-
          id(audio_ha_requested) = true;
          const bool effective = !id(hardware_mute_active);
          id(camera_audio_enabled).publish_state(effective);
          id(baby_monitor_media).set_audio_enabled(effective);
          if (effective && id(monitor_power).state) id(speaker_amp_enable).turn_on();
          else id(speaker_amp_enable).turn_off();
    turn_off_action:
      - lambda: |-
          id(audio_ha_requested) = false;
          id(camera_audio_enabled).publish_state(false);
          id(baby_monitor_media).set_audio_enabled(false);
          id(speaker_amp_enable).turn_off();

select:
  - platform: template
    id: camera_select
    name: "Camera"
    icon: "mdi:cctv"
    optimistic: true
    restore_value: false
    initial_option: "Camera 1"
    options:
      - "Camera 1"
      - "Camera 2"

    set_action:
      - lambda: |-
          id(active_alarm_level) = 0;
          id(baby_monitor_media).set_alarm_level(0);
          id(camera_1_motion_until) = id(camera_1_sound1_until) = id(camera_1_sound2_until) = id(camera_1_external_level2_until) = 0;
          id(camera_2_motion_until) = id(camera_2_sound1_until) = id(camera_2_sound2_until) = id(camera_2_external_level2_until) = 0;
          id(camera_1_sound_gate) = false;
          id(camera_2_sound_gate) = false;
          if (x == "Camera 2") {
            id(active_camera_index) = 1;
            id(baby_monitor_media).set_camera(1);
          } else {
            id(active_camera_index) = 0;
            id(baby_monitor_media).set_camera(0);
          }


number:
  - platform: template
    id: night_alarm_wake_time
    name: "Alarm Wake Time"
    icon: "mdi:timer-outline"
    entity_category: config
    unit_of_measurement: "s"
    min_value: 10
    max_value: 120
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 30
    set_action:
      - lambda: id(night_alarm_wake_seconds) = x;

  - platform: template
    id: camera_audio_volume
    name: "Camera Volume"
    icon: "mdi:volume-medium"
    entity_category: config
    unit_of_measurement: "%"
    min_value: 0
    max_value: 100
    step: 5
    optimistic: true
    restore_value: true
    initial_value: 25
    set_action:
      - lambda: |-
          id(camera_audio_volume_pct) = x;
          id(baby_monitor_media).set_audio_volume((x / 100.0f) * 0.20f);

  - platform: template
    id: camera_1_t1_offset_number
    name: "Camera 1 T1 offset"
    icon: "mdi:tune-vertical"
    entity_category: config
    unit_of_measurement: "dB"
    min_value: 5
    max_value: 35
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 15
    set_action:
      - lambda: id(camera_1_t1_offset) = x;

  - platform: template
    id: camera_1_t1_floor_number
    name: "Camera 1 T1 floor"
    icon: "mdi:volume-medium"
    entity_category: config
    unit_of_measurement: "dB"
    min_value: -75
    max_value: -30
    step: 1
    optimistic: true
    restore_value: true
    initial_value: -60
    set_action:
      - lambda: id(camera_1_t1_floor) = x;

  - platform: template
    id: camera_1_t2_offset_number
    name: "Camera 1 T2 offset"
    icon: "mdi:tune-vertical"
    entity_category: config
    unit_of_measurement: "dB"
    min_value: 10
    max_value: 45
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 32
    set_action:
      - lambda: id(camera_1_t2_offset) = x;

  - platform: template
    id: camera_1_t2_floor_number
    name: "Camera 1 T2 floor"
    icon: "mdi:volume-high"
    entity_category: config
    unit_of_measurement: "dB"
    min_value: -65
    max_value: -20
    step: 1
    optimistic: true
    restore_value: true
    initial_value: -40
    set_action:
      - lambda: id(camera_1_t2_floor) = x;

  - platform: template
    id: camera_2_t1_offset_number
    name: "Camera 2 T1 offset"
    icon: "mdi:tune-vertical"
    entity_category: config
    unit_of_measurement: "dB"
    min_value: 5
    max_value: 35
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 20
    set_action:
      - lambda: id(camera_2_t1_offset) = x;

  - platform: template
    id: camera_2_t1_floor_number
    name: "Camera 2 T1 floor"
    icon: "mdi:volume-medium"
    entity_category: config
    unit_of_measurement: "dB"
    min_value: -75
    max_value: -25
    step: 1
    optimistic: true
    restore_value: true
    initial_value: -45
    set_action:
      - lambda: id(camera_2_t1_floor) = x;

  - platform: template
    id: camera_2_t2_offset_number
    name: "Camera 2 T2 offset"
    icon: "mdi:tune-vertical"
    entity_category: config
    unit_of_measurement: "dB"
    min_value: 10
    max_value: 45
    step: 1
    optimistic: true
    restore_value: true
    initial_value: 30
    set_action:
      - lambda: id(camera_2_t2_offset) = x;

  - platform: template
    id: camera_2_t2_floor_number
    name: "Camera 2 T2 floor"
    icon: "mdi:volume-high"
    entity_category: config
    unit_of_measurement: "dB"
    min_value: -60
    max_value: -15
    step: 1
    optimistic: true
    restore_value: true
    initial_value: -32
    set_action:
      - lambda: id(camera_2_t2_floor) = x;

  - platform: template
    id: alarm_t1_confirm_number
    name: "Alarm T1 Confirmation"
    icon: "mdi:timer-outline"
    entity_category: config
    unit_of_measurement: "s"
    min_value: 0.25
    max_value: 5.0
    step: 0.25
    optimistic: true
    restore_value: true
    initial_value: 1.0
    set_action:
      - lambda: id(alarm_t1_confirm_ms) = (uint32_t) lroundf(x * 1000.0f);

  - platform: template
    id: alarm_t2_confirm_number
    name: "Alarm T2 Confirmation"
    icon: "mdi:timer-alert-outline"
    entity_category: config
    unit_of_measurement: "s"
    min_value: 0.25
    max_value: 3.0
    step: 0.25
    optimistic: true
    restore_value: true
    initial_value: 1.0
    set_action:
      - lambda: id(alarm_t2_confirm_ms) = (uint32_t) lroundf(x * 1000.0f);

text_sensor:
  - platform: template
    id: last_alarm_reason
    name: "Last Alarm Reason"
    icon: "mdi:alarm-note"
    entity_category: diagnostic
    update_interval: never

binary_sensor:
  - platform: gt911
    id: home_button
    gt911_id: box_touch
    index: 0
    internal: true
    on_press:
      - if:
          condition:
            switch.is_on: night_mode
          then:
            - switch.turn_off: night_mode
          else:
            - if:
                condition:
                  switch.is_on: monitor_power
                then:
                  - switch.turn_off: monitor_power
                else:
                  - switch.turn_on: monitor_power

  - platform: gpio
    id: night_mode_button
    internal: true
    pin:
      number: GPIO0
      mode: INPUT_PULLUP
      inverted: true
      ignore_strapping_warning: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_press:
      - switch.toggle: night_mode

  - platform: gpio
    id: hardware_mute_status
    internal: true
    pin:
      number: GPIO1
      mode: INPUT_PULLUP
      inverted: true
    filters:
      - delayed_on: 20ms
      - delayed_off: 20ms
    on_state:
      - lambda: |-
          id(hardware_mute_active) = x;
          const bool effective = id(audio_ha_requested) && !x;
          id(camera_audio_enabled).publish_state(effective);
          id(baby_monitor_media).set_audio_enabled(effective);
          if (effective && id(monitor_power).state) id(speaker_amp_enable).turn_on();
          else id(speaker_amp_enable).turn_off();
          ESP_LOGI("baby_mute", "Hardware MUTE=%s -> effective audio=%s", x ? "ON" : "OFF", effective ? "ON" : "OFF");

  - platform: homeassistant
    id: camera_1_motion
    entity_id: ${camera_1_motion_entity}
    internal: true
    on_press:
      - lambda: |-
          if (id(monitor_power).state && id(active_camera_index) == 0) {
            id(camera_1_motion_until) = millis() + 20000UL;
            ESP_LOGI("alarm", "Camera 1: motion -> hold 20s");
          }

  - platform: homeassistant
    id: camera_2_motion
    entity_id: ${camera_2_motion_entity}
    internal: true
    on_press:
      - lambda: |-
          if (id(monitor_power).state && id(active_camera_index) == 1) {
            id(camera_2_motion_until) = millis() + 20000UL;
            ESP_LOGI("alarm", "Camera 2: motion -> hold 20s");
          }

  - platform: template
    id: rtsp_connected
    name: "RTSP Connected"
    icon: "mdi:lan-connect"
    entity_category: diagnostic
    lambda: |-
      return id(baby_monitor_media).is_rtsp_connected();

sensor:
  - platform: adc
    id: battery_voltage
    name: "Battery Voltage"
    pin: GPIO10
    attenuation: auto
    update_interval: 30s
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 2
    filters:
      - multiply: ${battery_voltage_factor}
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1

  - platform: template
    id: battery_percent
    name: "Battery Level"
    icon: "mdi:battery"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      const float v=id(battery_voltage).state;
      if (isnan(v) || v < 2.5f || v > 4.5f) return NAN;
      struct P { float v,p; };
      static const P c[]={{3.20f,0},{3.30f,5},{3.50f,10},{3.60f,20},{3.70f,35},{3.75f,45},{3.80f,55},{3.85f,65},{3.90f,75},{4.00f,85},{4.10f,95},{4.20f,100}};
      float pct=0;
      if (v<=c[0].v) pct=0; else if (v>=c[11].v) pct=100; else {
        for (int i=1;i<12;i++) if (v<=c[i].v) { pct=c[i-1].p+(v-c[i-1].v)*(c[i].p-c[i-1].p)/(c[i].v-c[i-1].v); break; }
      }
      id(baby_monitor_media).set_ui_battery_percent(pct);
      return pct;

