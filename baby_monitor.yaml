sensor:
  - platform: adc
    id: battery_voltage
    name: "Battery Voltage"
    pin: GPIO10
    attenuation: auto
    update_interval: 30s
    unit_of_measurement: "V"
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 2
    filters:
      - multiply: ${battery_voltage_factor}
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1

  - platform: template
    id: battery_percent
    name: "Battery Level"
    icon: "mdi:battery"
    unit_of_measurement: "%"
    device_class: battery
    state_class: measurement
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      const float v=id(battery_voltage).state;
      if (isnan(v) || v < 2.5f || v > 4.5f) return NAN;
      struct P { float v,p; };
      static const P c[]={{3.20f,0},{3.30f,5},{3.50f,10},{3.60f,20},{3.70f,35},{3.75f,45},{3.80f,55},{3.85f,65},{3.90f,75},{4.00f,85},{4.10f,95},{4.20f,100}};
      float pct=0;
      if (v<=c[0].v) pct=0; else if (v>=c[11].v) pct=100; else {
        for (int i=1;i<12;i++) if (v<=c[i].v) { pct=c[i-1].p+(v-c[i-1].v)*(c[i].p-c[i-1].p)/(c[i].v-c[i-1].v); break; }
      }
      id(baby_monitor_media).set_ui_battery_percent(pct);
      return pct;

  - platform: wifi_signal
    id: wifi_rssi
    name: "Wi-Fi RSSI"
    icon: "mdi:wifi"
    update_interval: 30s
    entity_category: diagnostic

  - platform: template
    id: wifi_quality
    name: "Wi-Fi Quality"
    icon: "mdi:wifi-strength-2"
    unit_of_measurement: "%"
    state_class: measurement
    entity_category: diagnostic
    accuracy_decimals: 0
    update_interval: 30s
    lambda: |-
      const float r=id(wifi_rssi).state;
      if (isnan(r)) return NAN;
      if (r <= -100.0f) return 0.0f;
      if (r >= -50.0f) return 100.0f;
      return 2.0f * (r + 100.0f);

  - platform: template
    id: camera_1_sound_level
    internal: true
    unit_of_measurement: "dBFS"
    accuracy_decimals: 1
    update_interval: 250ms
    lambda: |-
      if (!(id(monitor_power).state && id(active_camera_index) == 0)) return NAN;
      if (!id(baby_monitor_media).is_rtsp_connected() || !id(baby_monitor_media).has_sound_data()) return NAN;
      return id(baby_monitor_media).get_sound_rms_dbfs();
    on_value:
      - lambda: |-
          if (isnan(x)) return;
          const uint32_t now = millis();
          id(camera_1_sound_last_ms) = now;
          float t1 = fmaxf(id(camera_1_baseline) + id(camera_1_t1_offset_v122), id(camera_1_t1_floor_v122));
          float t2 = fmaxf(id(camera_1_baseline) + id(camera_1_t2_offset), id(camera_1_t2_floor));

          const bool candidate_active =
              (id(camera_1_t1_started) != 0) || (id(camera_1_t2_started) != 0);
          const bool near_or_above_t1 = x >= (t1 - 3.0f);

          if (candidate_active || near_or_above_t1) {
            id(camera_1_baseline_resume_after_ms_v120d4) = now + 3000UL;
            id(camera_1_ambient_started_ms)=0; id(camera_1_ambient_nudge_ms)=0;
            id(camera_1_ambient_candidate)=id(camera_1_ambient_min)=id(camera_1_ambient_max)=NAN;
          } else if ((int32_t)(id(camera_1_baseline_resume_after_ms_v120d4) - now) > 0) {
            id(camera_1_ambient_started_ms)=0; id(camera_1_ambient_nudge_ms)=0;
            id(camera_1_ambient_candidate)=id(camera_1_ambient_min)=id(camera_1_ambient_max)=NAN;
          } else if (x < t1 - 6.0f) {
            id(camera_1_baseline) = 0.98f * id(camera_1_baseline) + 0.02f * x;
            id(camera_1_baseline) = fmaxf(-82.0f, fminf(-60.0f, id(camera_1_baseline)));
            id(camera_1_ambient_started_ms)=0; id(camera_1_ambient_nudge_ms)=0;
            id(camera_1_ambient_candidate)=id(camera_1_ambient_min)=id(camera_1_ambient_max)=NAN;
          } else if (x < t1 - 3.0f) {
            if (id(camera_1_ambient_started_ms)==0 || isnan(id(camera_1_ambient_candidate))) {
              id(camera_1_ambient_started_ms)=now; id(camera_1_ambient_nudge_ms)=now;
              id(camera_1_ambient_candidate)=id(camera_1_ambient_min)=id(camera_1_ambient_max)=x;
            } else {
              id(camera_1_ambient_candidate)=0.90f*id(camera_1_ambient_candidate)+0.10f*x;
              id(camera_1_ambient_min)=fminf(id(camera_1_ambient_min),x);
              id(camera_1_ambient_max)=fmaxf(id(camera_1_ambient_max),x);
              if (id(camera_1_ambient_max)-id(camera_1_ambient_min) > 4.0f) {
                id(camera_1_ambient_started_ms)=now; id(camera_1_ambient_nudge_ms)=now;
                id(camera_1_ambient_candidate)=id(camera_1_ambient_min)=id(camera_1_ambient_max)=x;
              } else if ((uint32_t)(now-id(camera_1_ambient_started_ms)) >= 60000UL) {
                const float max_step=fminf(1.0f, fmaxf(0.02f, (now-id(camera_1_ambient_nudge_ms))/30000.0f));
                const float d=id(camera_1_ambient_candidate)-id(camera_1_baseline);
                id(camera_1_baseline)+=fmaxf(-max_step,fminf(max_step,d));
                id(camera_1_baseline)=fmaxf(-82.0f, fminf(-60.0f, id(camera_1_baseline)));
                id(camera_1_ambient_nudge_ms)=now;
              }
            }
          }

          if (!(id(monitor_power).state && id(active_camera_index) == 0)) {
            id(camera_1_sound_gate) = false;
            id(camera_1_t1_started)=0;
            id(camera_1_t2_started)=0;
            id(camera_1_t1_armed_v120d5)=false;
            id(camera_1_t2_armed_v120d5)=false;
            return;
          }

          const float hyst = id(alarm_audio_hysteresis_db_v120d2);

          if (!id(camera_1_sound_gate)) {
            if (x < t1 - 3.0f) {
              id(camera_1_sound_gate) = true;
              id(camera_1_t1_armed_v120d5) = true;
              id(camera_1_t2_armed_v120d5) = true;
            }
            return;
          }

          if (!id(camera_1_t1_armed_v120d5) && x < t1 - hyst) {
            id(camera_1_t1_armed_v120d5) = true;
            id(camera_1_t1_started) = 0;
          }
          if (!id(camera_1_t2_armed_v120d5) && x < t2 - hyst) {
            id(camera_1_t2_armed_v120d5) = true;
            id(camera_1_t2_started) = 0;
          }

          if (id(camera_1_t2_armed_v120d5)) {
            if (id(camera_1_t2_started)==0) {
              if (x >= t2) id(camera_1_t2_started)=now;
            } else if (x < t2 - hyst) {
              id(camera_1_t2_started)=0;
            }

            if (id(camera_1_t2_started)!=0 &&
                (uint32_t)(now-id(camera_1_t2_started)) >= id(alarm_t2_confirm_ms)) {
              if ((int32_t)(id(camera_1_sound2_until) - now) <= 0) {
                id(camera_1_sound2_until)=now+id(alarm_t2_hold_ms_v120d2);
              }
              id(camera_1_t2_armed_v120d5)=false;
              id(camera_1_t2_started)=0;
            }
          }

          if (id(camera_1_t1_armed_v120d5)) {
            if (id(camera_1_t1_started)==0) {
              if (x >= t1) id(camera_1_t1_started)=now;
            } else if (x < t1 - hyst) {
              id(camera_1_t1_started)=0;
            }

            if (id(camera_1_t1_started)!=0 &&
                (uint32_t)(now-id(camera_1_t1_started)) >= id(alarm_t1_confirm_ms_v122)) {
              if ((int32_t)(id(camera_1_sound1_until) - now) <= 0) {
                id(camera_1_sound1_until)=now+id(alarm_t1_hold_ms_v120d2);
              }
              id(camera_1_t1_armed_v120d5)=false;
              id(camera_1_t1_started)=0;
            }
          }
  - platform: template
    id: camera_2_sound_level
    internal: true
    unit_of_measurement: "dBFS"
    accuracy_decimals: 1
    update_interval: 250ms
    lambda: |-
      if (!(id(monitor_power).state && id(active_camera_index) == 1)) return NAN;
      if (!id(baby_monitor_media).is_rtsp_connected() || !id(baby_monitor_media).has_sound_data()) return NAN;
      return id(baby_monitor_media).get_sound_rms_dbfs();
    on_value:
      - lambda: |-
          if (isnan(x)) return;
          const uint32_t now = millis();
          id(camera_2_sound_last_ms) = now;
          float t1 = fmaxf(id(camera_2_baseline) + id(camera_2_t1_offset), id(camera_2_t1_floor));
          float t2 = fmaxf(id(camera_2_baseline) + id(camera_2_t2_offset), id(camera_2_t2_floor));

          const bool candidate_active =
              (id(camera_2_t1_started) != 0) || (id(camera_2_t2_started) != 0);
          const bool near_or_above_t1 = x >= (t1 - 3.0f);

          if (candidate_active || near_or_above_t1) {
            id(camera_2_baseline_resume_after_ms_v120d4) = now + 3000UL;
            id(camera_2_ambient_started_ms)=0; id(camera_2_ambient_nudge_ms)=0;
            id(camera_2_ambient_candidate)=id(camera_2_ambient_min)=id(camera_2_ambient_max)=NAN;
          } else if ((int32_t)(id(camera_2_baseline_resume_after_ms_v120d4) - now) > 0) {
            id(camera_2_ambient_started_ms)=0; id(camera_2_ambient_nudge_ms)=0;
            id(camera_2_ambient_candidate)=id(camera_2_ambient_min)=id(camera_2_ambient_max)=NAN;
          } else if (x < t1 - 6.0f) {
            id(camera_2_baseline) = 0.98f * id(camera_2_baseline) + 0.02f * x;
            id(camera_2_baseline) = fmaxf(-82.0f, fminf(-60.0f, id(camera_2_baseline)));
            id(camera_2_ambient_started_ms)=0; id(camera_2_ambient_nudge_ms)=0;
            id(camera_2_ambient_candidate)=id(camera_2_ambient_min)=id(camera_2_ambient_max)=NAN;
          } else if (x < t1 - 3.0f) {
            if (id(camera_2_ambient_started_ms)==0 || isnan(id(camera_2_ambient_candidate))) {
              id(camera_2_ambient_started_ms)=now; id(camera_2_ambient_nudge_ms)=now;
              id(camera_2_ambient_candidate)=id(camera_2_ambient_min)=id(camera_2_ambient_max)=x;
            } else {
              id(camera_2_ambient_candidate)=0.90f*id(camera_2_ambient_candidate)+0.10f*x;
              id(camera_2_ambient_min)=fminf(id(camera_2_ambient_min),x);
              id(camera_2_ambient_max)=fmaxf(id(camera_2_ambient_max),x);
              if (id(camera_2_ambient_max)-id(camera_2_ambient_min) > 4.0f) {
                id(camera_2_ambient_started_ms)=now; id(camera_2_ambient_nudge_ms)=now;
                id(camera_2_ambient_candidate)=id(camera_2_ambient_min)=id(camera_2_ambient_max)=x;
              } else if ((uint32_t)(now-id(camera_2_ambient_started_ms)) >= 60000UL) {
                const float max_step=fminf(1.0f, fmaxf(0.02f, (now-id(camera_2_ambient_nudge_ms))/30000.0f));
                const float d=id(camera_2_ambient_candidate)-id(camera_2_baseline);
                id(camera_2_baseline)+=fmaxf(-max_step,fminf(max_step,d));
                id(camera_2_baseline)=fmaxf(-82.0f, fminf(-60.0f, id(camera_2_baseline)));
                id(camera_2_ambient_nudge_ms)=now;
              }
            }
          }

          if (!(id(monitor_power).state && id(active_camera_index) == 1)) {
            id(camera_2_sound_gate) = false;
            id(camera_2_t1_started)=0;
            id(camera_2_t2_started)=0;
            id(camera_2_t1_armed_v120d5)=false;
            id(camera_2_t2_armed_v120d5)=false;
            return;
          }

          const float hyst = id(alarm_audio_hysteresis_db_v120d2);

          if (!id(camera_2_sound_gate)) {
            if (x < t1 - 3.0f) {
              id(camera_2_sound_gate) = true;
              id(camera_2_t1_armed_v120d5) = true;
              id(camera_2_t2_armed_v120d5) = true;
            }
            return;
          }

          if (!id(camera_2_t1_armed_v120d5) && x < t1 - hyst) {
            id(camera_2_t1_armed_v120d5) = true;
            id(camera_2_t1_started) = 0;
          }
          if (!id(camera_2_t2_armed_v120d5) && x < t2 - hyst) {
            id(camera_2_t2_armed_v120d5) = true;
            id(camera_2_t2_started) = 0;
          }

          if (id(camera_2_t2_armed_v120d5)) {
            if (id(camera_2_t2_started)==0) {
              if (x >= t2) id(camera_2_t2_started)=now;
            } else if (x < t2 - hyst) {
              id(camera_2_t2_started)=0;
            }

            if (id(camera_2_t2_started)!=0 &&
                (uint32_t)(now-id(camera_2_t2_started)) >= id(alarm_t2_confirm_ms)) {
              if ((int32_t)(id(camera_2_sound2_until) - now) <= 0) {
                id(camera_2_sound2_until)=now+id(alarm_t2_hold_ms_v120d2);
              }
              id(camera_2_t2_armed_v120d5)=false;
              id(camera_2_t2_started)=0;
            }
          }

          if (id(camera_2_t1_armed_v120d5)) {
            if (id(camera_2_t1_started)==0) {
              if (x >= t1) id(camera_2_t1_started)=now;
            } else if (x < t1 - hyst) {
              id(camera_2_t1_started)=0;
            }

            if (id(camera_2_t1_started)!=0 &&
                (uint32_t)(now-id(camera_2_t1_started)) >= id(alarm_t1_confirm_ms_v122)) {
              if ((int32_t)(id(camera_2_sound1_until) - now) <= 0) {
                id(camera_2_sound1_until)=now+id(alarm_t1_hold_ms_v120d2);
              }
              id(camera_2_t1_armed_v120d5)=false;
              id(camera_2_t1_started)=0;
            }
          }
