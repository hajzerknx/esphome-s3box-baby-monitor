    icon: "mdi:waveform"
    unit_of_measurement: "dB"
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      return id(active_alarm_baseline);

  - platform: template
    id: alarm_t1_diag
    name: "Alarm T1"
    icon: "mdi:volume-medium"
    unit_of_measurement: "dB"
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      return id(active_alarm_t1);

  - platform: template
    id: alarm_t2_diag
    name: "Alarm T2"
    icon: "mdi:volume-high"
    unit_of_measurement: "dB"
    entity_category: diagnostic
    accuracy_decimals: 1
    update_interval: 5s
    lambda: |-
      return id(active_alarm_t2);

interval:
  - interval: 250ms
    then:
      - lambda: |-
          const uint32_t now = millis();
          if (!id(monitor_power).state) {
            if (id(active_alarm_level) != 0) { id(active_alarm_level)=0; id(baby_monitor_media).set_alarm_level(0); }
            return;
          }

          if (id(night_mode).state && id(active_alarm_level) == 0 &&
              id(night_wake_until) != 0 &&
              (int32_t)(now - id(night_wake_until)) >= 0) {
            id(night_wake_until) = 0;
            id(backlight_output).turn_off();
          }

          const bool camera_1 = id(active_camera_index) == 0;
          const uint32_t fresh = camera_1 ? id(camera_1_ha_last_ms) : id(camera_2_ha_last_ms);
          if (fresh == 0 || (uint32_t)(now - fresh) > 30000UL) {
            if (id(active_alarm_level) != 0) {
              ESP_LOGW("alarm", "HA alarm feed stale >30s; clearing alarm");
              id(active_alarm_level)=0; id(baby_monitor_media).set_alarm_level(0);
            }
            return;
          }

          uint32_t motion_until, s1_until, s2_until, external_level2_until;
          float baseline, t1, t2;
          if (camera_1) {
            motion_until=id(camera_1_motion_until); s1_until=id(camera_1_sound1_until);
            s2_until=id(camera_1_sound2_until); external_level2_until=id(camera_1_external_level2_until);
            baseline=id(camera_1_baseline);
            t1=fmaxf(baseline+id(camera_1_t1_offset), id(camera_1_t1_floor));
            t2=fmaxf(baseline+id(camera_1_t2_offset), id(camera_1_t2_floor));
          } else {
            motion_until=id(camera_2_motion_until); s1_until=id(camera_2_sound1_until);
            s2_until=id(camera_2_sound2_until); external_level2_until=id(camera_2_external_level2_until);
            baseline=id(camera_2_baseline);
            t1=fmaxf(baseline+id(camera_2_t1_offset), id(camera_2_t1_floor));
            t2=fmaxf(baseline+id(camera_2_t2_offset), id(camera_2_t2_floor));
          }
          id(active_alarm_baseline)=baseline; id(active_alarm_t1)=t1; id(active_alarm_t2)=t2;

          const bool motion = (int32_t)(motion_until - now) > 0;
          const bool sound1 = (int32_t)(s1_until - now) > 0;
          const bool sound2 = (int32_t)(s2_until - now) > 0;
          const bool external_level2 = (int32_t)(external_level2_until - now) > 0;
          int level = 0;
          if (external_level2 || sound2 || (motion && sound1)) level = 2;
          else if (motion || sound1) level = 1;

          if (id(night_mode).state && level > 0) {
            const uint32_t wake_ms = (uint32_t) lroundf(id(night_alarm_wake_seconds) * 1000.0f);
            id(night_wake_until) = now + wake_ms;
            id(backlight_output).turn_on();
          }

          if (level != id(active_alarm_level)) {
            ESP_LOGI("alarm", "%s alarm %d -> %d (B=%.1f T1=%.1f T2=%.1f m=%d s=%d s2=%d ext2=%d)",
                     camera_1 ? "Camera 1" : "Camera 2", id(active_alarm_level), level,
                     baseline, t1, t2, motion, sound1, sound2, external_level2);

            if (level > 0 && level > id(active_alarm_level)) {
              std::string reason = camera_1 ? "Camera 1: " : "Camera 2: ";
              if (external_level2) reason += "external level 2 event";
              else if (sound2) reason += "sound T2";
              else if (motion && sound1) reason += "motion + sound T1";
              else if (sound1) reason += "sound T1";
              else if (motion) reason += "motion";
              else reason += "alarm";
              id(last_alarm_reason).publish_state(reason);
            }

            id(active_alarm_level)=level;
            id(baby_monitor_media).set_alarm_level((uint8_t)level);
          }
