    id: cry_ml_ready_v140d1
    name: "Cry ML Model Ready"
    icon: "mdi:chip"
    entity_category: diagnostic
    lambda: return id(baby_monitor_media).is_cry_model_ready();

  - platform: template
    id: cry_ml_candidate_v140d1
    name: "Cry ML Candidate"
    icon: "mdi:baby-face"
    entity_category: diagnostic
    lambda: |-
      if (!id(monitor_power).state || !id(baby_monitor_media).is_rtsp_connected() ||
          !id(baby_monitor_media).is_cry_model_ready()) return false;
      return id(baby_monitor_media).is_cry_ml_candidate();
    on_press:
      - lambda: |-
          const uint32_t until = millis() + 60000UL;
          if (id(active_camera_index) == 0) {
            id(camera_1_cry_until) = until;
            ESP_LOGI("alarm", "${camera_1_name}: LOCAL Cry ML -> level 2 hold 60s");
          } else {
            id(camera_2_cry_until) = until;
            ESP_LOGI("alarm", "${camera_2_name}: LOCAL Cry ML -> level 2 hold 60s");
          }

  - platform: gt911
    id: home_button
    gt911_id: box_touch
    index: 0
    internal: true
    on_press:
      - if:
          condition:
            switch.is_on: night_mode
          then:
            - switch.turn_off: night_mode
          else:
            - if:
                condition:
                  switch.is_on: monitor_power
                then:
                  - switch.turn_off: monitor_power
                else:
                  - switch.turn_on: monitor_power

  - platform: gpio
