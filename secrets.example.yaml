# Copy to secrets.yaml and replace every placeholder.

wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

baby_monitor_box3__camera_user: "CAMERA_USERNAME"
baby_monitor_box3__camera_password: "CAMERA_PASSWORD"

baby_monitor_camera_1_host: "192.168.1.101"
baby_monitor_camera_2_host: "192.168.1.102"

# These values are needed only if you keep the manual_ip block in baby_monitor.yaml.
# You may remove manual_ip and use DHCP instead.
baby_monitor_static_ip: "192.168.1.50"
network_gateway: "192.168.1.1"
network_subnet: "255.255.255.0"
